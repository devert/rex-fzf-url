<!doctype html>
<!-- test/run.sh --open opens this page. Each link opens a report in a new tab. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage reports</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --bg: #fff; --link: #0969da; --line: #d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f0f6fc; --muted: #9198a1; --bg: #0d1117; --link: #4493f8; --line: #3d444d; }
  }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 12px 0; border-top: 1px solid var(--line); }
  li:last-child { border-bottom: 1px solid var(--line); }
  a { color: var(--link); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
